<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silly story generator</title>
    <style>
      body {
        font-family: 'Georgia', serif;
        width: 400px;
        background-color: #f4f4f9;
        color: #222222;
        padding: 20px;
        margin: 30px auto;
        border: 2px solid #4a6984;
        border-radius: 8px;
      }

      label {
        font-weight: bold;
        color: #2c3e50;
      }

      div {
        padding-bottom: 15px;
      }

      input[type="text"] {
        padding: 6px;
        border: 1px solid #a0a0a0;
        border-radius: 4px;
        width: 160px;
      }

      button {
        background-color: #4a6984;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #354a5f;
      }

      p {
        background-color: #e8eef3;
        color: #1a252f;
        padding: 12px;
        border-radius: 4px;
        line-height: 1.5;
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <div>
      <label for="customname">Enter custom name:</label>
      <input id="customname" type="text" placeholder="" />
    </div>
    <div>
      <label for="us">US</label
      ><input id="us" type="radio" name="ukus" value="us" checked />
      <label for="uk">UK</label
      ><input id="uk" type="radio" name="ukus" value="uk" />
    </div>
    <div>
      <button class="randomize">Generate random story</button>
    </div>
    <p class="story"></p>

    <script>
      // 1. COMPLETE VARIABLE AND FUNCTION DEFINITIONS

      const customName = document.getElementById('customname');
      const randomize = document.querySelector('.randomize');
      const story = document.querySelector('.story');

      function randomValueFromArray(array){
        const random = Math.floor(Math.random()*array.length);
        return array[random];
      }

      // 2. RAW TEXT STRINGS

      const storyText = 'It was 94 Farenheit outside, so :insertx: had a game. When he got to :inserty:, he entered the pitch confidently, but in the 90th minute of the game, he :insertz:. Bob saw the whole thing from the stands, and was shocked — :insertx: weighs 300 pounds, so it was surprising to see that happen.';
      const insertX = ['Harry Kane', 'Kylian Mbappe', 'Lamine Yamal'];
      const insertY = ['Camp Nou', 'the Santiago Bernabeu', 'the Allianz Arena'];
      const insertZ = ['scored an amazing goal', 'got a red card', 'broke his leg'];

      // 3. EVENT LISTENER AND PARTIAL FUNCTION DEFINITION

      randomize.addEventListener('click', result);

      function result() {
        let newStory = storyText;

        const xItem = randomValueFromArray(insertX);
        const yItem = randomValueFromArray(insertY);
        const zItem = randomValueFromArray(insertZ);

        newStory = newStory.replaceAll(':insertx:', xItem);
        newStory = newStory.replaceAll(':inserty:', yItem);
        newStory = newStory.replaceAll(':insertz:', zItem);

        if (customName.value !== '') {
          const name = customName.value;
          newStory = newStory.replaceAll('Bob', name);
        }

        if (document.getElementById("uk").checked) {
          const weight = Math.round(300 * 0.0714286) + ' stone';
          const temperature =  Math.round((94 - 32) * (5 / 9)) + ' Celsius';
          newStory = newStory.replaceAll('94 Farenheit', temperature);
          newStory = newStory.replaceAll('300 pounds', weight);
        }

        story.textContent = newStory;
        story.style.visibility = 'visible';
      }
    </script>
  </body>
</html>
